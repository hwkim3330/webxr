<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebXR Stream Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      overflow: hidden;
      position: relative;
    }

    #remoteVideo {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    /* Loading Overlay */
    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s;
    }

    #loadingOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-spinner {
      width: 64px;
      height: 64px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3ea6ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      opacity: 0.7;
    }

    /* Status Bar */
    #statusBar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 24px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      opacity: 1;
      transition: opacity 0.3s;
    }

    #statusBar.hidden {
      opacity: 0;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-badge {
      background: #ff0000;
      color: white;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-badge::before {
      content: '●';
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status-text {
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      font-weight: 500;
    }

    .status-right {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-value {
      font-variant-numeric: tabular-nums;
    }

    .stat-value.good { color: #00ff88; }
    .stat-value.warning { color: #ffaa00; }
    .stat-value.danger { color: #ff4444; }

    /* Controls Overlay */
    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 50;
      opacity: 1;
      transition: opacity 0.3s;
    }

    #controls.hidden {
      opacity: 0;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .control-btn:active {
      transform: translateY(0);
    }

    /* Fullscreen Button */
    #fullscreenBtn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #fullscreenBtn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }

    /* Mobile Optimizations */
    @media (max-width: 768px) {
      #statusBar {
        padding: 8px 16px;
      }

      .status-right {
        font-size: 11px;
        gap: 8px;
      }

      .live-badge {
        font-size: 10px;
        padding: 3px 8px;
      }

      .control-btn {
        padding: 10px 16px;
        font-size: 13px;
      }

      #fullscreenBtn {
        bottom: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
        font-size: 18px;
      }
    }

    /* Auto-hide controls */
    body.playing #statusBar,
    body.playing #controls {
      opacity: 0;
      pointer-events: none;
    }

    body.playing:hover #statusBar,
    body.playing:hover #controls {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <video id="remoteVideo" autoplay playsinline></video>

  <div id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Connecting to stream...</div>
  </div>

  <div id="statusBar">
    <div class="status-left">
      <div class="live-badge" id="liveBadge" style="display: none;">Live</div>
      <div class="status-text" id="statusText">Waiting for stream...</div>
    </div>
    <div class="status-right" id="statsDisplay" style="display: none;">
      <div class="stat-item">
        <span class="stat-value" id="codec">-</span>
        <span>codec</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="resolution">-</span>
        <span>res</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="fps">0</span>
        <span>fps</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="bitrate">0</span>
        <span>kbps</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="latency">0</span>
        <span>ms</span>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="control-btn" id="reconnectBtn">
      Reconnect
    </button>
  </div>

  <button id="fullscreenBtn" title="Fullscreen">⛶</button>

  <script>
    const remoteVideo = document.getElementById('remoteVideo');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const statusText = document.getElementById('statusText');
    const liveBadge = document.getElementById('liveBadge');
    const statsDisplay = document.getElementById('statsDisplay');
    const reconnectBtn = document.getElementById('reconnectBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    let ws = null;
    let peerConnection = null;
    let receiverId = null;
    let statsInterval = null;

    function updateStatus(text) {
      statusText.textContent = text;
      loadingText.textContent = text;
    }

    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}?role=receiver`;
      console.log('[WS] Connecting:', wsUrl);

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        updateStatus('Connected - Waiting for stream...');
        console.log('[WS] Connected');
      };

      ws.onmessage = async (event) => {
        const data = JSON.parse(event.data);
        console.log('[←]', data.type);

        if (data.type === 'receiver-id') {
          receiverId = data.receiverId;
          console.log('[RECEIVER] ID:', receiverId);
        }
        else if (data.type === 'waiting-for-sender') {
          updateStatus('Waiting for broadcaster...');
        }
        else if (data.type === 'offer') {
          console.log('[OFFER] Received');
          await handleOffer(data.offer);
        }
        else if (data.type === 'ice-candidate') {
          if (peerConnection && data.candidate) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
          }
        }
        else if (data.type === 'sender-disconnected') {
          updateStatus('Stream ended');
          loadingOverlay.classList.remove('hidden');
          liveBadge.style.display = 'none';
          statsDisplay.style.display = 'none';
          if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
          }
        }
      };

      ws.onerror = () => updateStatus('Connection error');
      ws.onclose = () => {
        updateStatus('Disconnected - Reconnecting...');
        setTimeout(connectWebSocket, 3000);
      };
    }

    async function handleOffer(offer) {
      console.log('[OFFER] Creating PeerConnection');

      const config = {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
          { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
        ],
        sdpSemantics: 'unified-plan',
        bundlePolicy: 'max-bundle',
        rtcpMuxPolicy: 'require',
        iceCandidatePoolSize: 10
      };

      peerConnection = new RTCPeerConnection(config);

      peerConnection.ontrack = (event) => {
        console.log('[STREAM] ✓ Started');
        remoteVideo.srcObject = event.streams[0];
        loadingOverlay.classList.add('hidden');
        liveBadge.style.display = 'flex';
        statsDisplay.style.display = 'flex';
        updateStatus('Live streaming');
        document.body.classList.add('playing');
        startStatsMonitoring();
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'ice-candidate',
            candidate: event.candidate
          }));
        }
      };

      peerConnection.oniceconnectionstatechange = () => {
        console.log('[ICE]', peerConnection.iceConnectionState);
      };

      peerConnection.onconnectionstatechange = () => {
        console.log('[CONNECTION]', peerConnection.connectionState);
        if (peerConnection.connectionState === 'connected') {
          console.log('[CONNECTION] ✓ Connected');
        } else if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
          updateStatus('Connection lost');
          loadingOverlay.classList.remove('hidden');
          liveBadge.style.display = 'none';
          statsDisplay.style.display = 'none';

          // Clear stats
          if (statsInterval) {
            clearInterval(statsInterval);
            statsInterval = null;
          }
          document.getElementById('codec').textContent = '-';
          document.getElementById('resolution').textContent = '-';
          document.getElementById('fps').textContent = '0';
          document.getElementById('bitrate').textContent = '0';
          document.getElementById('latency').textContent = '0';
        }
      };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      ws.send(JSON.stringify({
        type: 'answer',
        answer: answer
      }));

      console.log('[→] Answer sent');
    }

    function startStatsMonitoring() {
      if (statsInterval) clearInterval(statsInterval);

      statsInterval = setInterval(async () => {
        if (!peerConnection) return;

        const stats = await peerConnection.getStats();
        let codecInfo = null;

        stats.forEach(report => {
          // 코덱 정보
          if (report.type === 'inbound-rtp' && report.mediaType === 'video' && report.codecId) {
            codecInfo = report.codecId;

            if (report.framesPerSecond) {
              const fpsEl = document.getElementById('fps');
              const fps = Math.round(report.framesPerSecond);
              fpsEl.textContent = fps;
              fpsEl.className = fps >= 25 ? 'stat-value good' : fps >= 15 ? 'stat-value warning' : 'stat-value danger';
            }

            if (report.bytesReceived) {
              const bitrate = Math.round(report.bytesReceived * 8 / 1000);
              const bitrateEl = document.getElementById('bitrate');
              bitrateEl.textContent = bitrate;
              bitrateEl.className = bitrate > 1500 ? 'stat-value good' : bitrate > 800 ? 'stat-value warning' : 'stat-value danger';
            }

            // 해상도 정보
            if (report.frameWidth && report.frameHeight) {
              const resEl = document.getElementById('resolution');
              resEl.textContent = `${report.frameWidth}x${report.frameHeight}`;
              resEl.className = 'stat-value good';
            }
          }

          // 코덱 상세 정보
          if (report.type === 'codec' && report.id === codecInfo) {
            const codecEl = document.getElementById('codec');
            const codecName = report.mimeType ? report.mimeType.split('/')[1].toUpperCase() : 'Unknown';
            codecEl.textContent = codecName;
            codecEl.className = 'stat-value good';
          }

          if (report.type === 'candidate-pair' && report.state === 'succeeded') {
            if (report.currentRoundTripTime) {
              const latency = Math.round(report.currentRoundTripTime * 1000);
              const latencyEl = document.getElementById('latency');
              latencyEl.textContent = latency;
              latencyEl.className = latency < 100 ? 'stat-value good' : latency < 300 ? 'stat-value warning' : 'stat-value danger';
            }
          }
        });
      }, 1000);
    }

    reconnectBtn.onclick = () => location.reload();

    fullscreenBtn.onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };

    let hideTimeout;
    document.addEventListener('mousemove', () => {
      document.body.style.cursor = 'default';
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        if (document.body.classList.contains('playing')) {
          document.body.style.cursor = 'none';
        }
      }, 3000);
    });

    connectWebSocket();
  </script>
</body>
</html>
